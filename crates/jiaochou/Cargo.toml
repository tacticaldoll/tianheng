[package]
name = "jiaochou"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# 校讎 (Jiàochóu) — collation: two texts laid side by side to find where they disagree. That is what
# every reaction here does — AGENTS.md against ci.yml, CHANGELOG against the tree, a spec against the
# code that answers it, a generated document against its generator. Named from this repository's own
# vocabulary, where 垂象 surfaces a reaction, 實錄 records one, and 校讎 amends one.
description = "校讎 (Jiaochou) — collation: this repository's record held against itself. Not product; ships in no package."
publish = false

[dependencies]
# The law's own locator, so the repository is found one way rather than once per reaction.
shengmo = { path = "../shengmo" }
# Reactions that read the product's declared surface — the bound register and the observer protocol.
tianheng = { path = "../tianheng" }
# Cargo's `--message-format=json` stream: a corpus comes from the build, never from a list.
serde_json = { workspace = true }
