# 天衡 (Tiānhéng) workspace.
#
# A reactive architectural-governance crate family. The real crates (no stubs — see below):
#   - xuanji  (璇璣): the dimension-agnostic reaction model — the 底.
#   - xingbiao(星表): the shared declared-workspace-data substrate — reads `cargo metadata`;
#                     serde_json-only and below every dimension like 璇璣, so the static and
#                     semantic dimensions read the workspace through one source of truth.
#   - guibiao (圭表): the gnomon — dependency-light static observation core, derived from modou.
#   - hunyi   (渾儀): the armillary — semantic (AST/syn) observation; the syn dependency lives here.
#   - louke   (漏刻): the clepsydra — runtime observation; ships into prod, depends on 璇璣 only.
#   - tianheng(天衡): the celestial balance — CLI shell + facade that composes the CI dimensions.
#
# All three 儀 are now born (圭表 static, 渾儀 semantic, 漏刻 runtime); each was created only
# WHEN built (drift law: no name without a reaction).
[workspace]
resolver = "2"
members = ["crates/xuanji", "crates/xingbiao", "crates/hunyi", "crates/guibiao", "crates/louke", "crates/tianheng", "crates/shengmo"]
# Every fixture and example is its own workspace root (each carries `[workspace]`), which is what
# actually keeps this workspace from absorbing their deliberate faults — `members` above is an
# explicit list with no globs, so nothing under these trees is inferred into it. These two entries
# are the second line of that defence, for a future fixture or example added without its own
# `[workspace]` table: excluded, it stays out; unexcluded, cargo would refuse to operate inside it
# until the author picks one.
#
# Named as directory prefixes rather than one entry per package on purpose. The per-package list
# they replace covered 3 of 5 fixtures and 3 of 6 examples — it had drifted, silently, because a
# hand-maintained enumeration of a directory's contents rots as the directory grows, and a
# governance rule that has drifted is read as license rather than law. A prefix cannot fall behind
# what it contains. CI exercises the examples in isolation via scripts/test_examples.sh.
exclude = ["crates/tianheng/tests/fixtures", "examples"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tacticaldoll/tianheng"
homepage = "https://github.com/tacticaldoll/tianheng"

[workspace.dependencies]
xuanji = { path = "crates/xuanji", version = "0.4.0" }
xingbiao = { path = "crates/xingbiao", version = "0.4.0" }
hunyi = { path = "crates/hunyi", version = "0.4.0" }
guibiao = { path = "crates/guibiao", version = "0.4.0" }
louke = { path = "crates/louke", version = "0.4.0" }
serde_json = "1"
# syn is the heavy AST dependency, quarantined to 渾儀 (hunyi) alone — never the
# 圭表 core or 璇璣 model (enforced by crates/shengmo/src/law.rs).
syn = { version = "2", features = ["full", "visit"] }
