# 天衡 (Tiānhéng) workspace.
#
# A reactive architectural-governance crate family. The real crates (no stubs — see below):
#   - xuanji  (璇璣): the dimension-agnostic reaction model — the 底.
#   - xingbiao(星表): the shared declared-workspace-data substrate — reads `cargo metadata`;
#                     serde_json-only and below every dimension like 璇璣, so the static and
#                     semantic dimensions read the workspace through one source of truth.
#   - guibiao (圭表): the gnomon — dependency-light static observation core, derived from modou.
#   - hunyi   (渾儀): the armillary — semantic (AST/syn) observation; the only PACKAGED crate that
#                     depends on syn (see the `[workspace.dependencies]` entry below for the perimeter).
#   - louke   (漏刻): the clepsydra — runtime observation; ships into prod, depends on 璇璣 only.
#   - tianheng(天衡): the celestial balance — CLI shell + facade that composes the CI dimensions.
#
# All three 儀 are now born (圭表 static, 渾儀 semantic, 漏刻 runtime); each was created only
# WHEN built (drift law: no name without a reaction).
[workspace]
resolver = "2"
members = ["crates/xuanji", "crates/xingbiao", "crates/hunyi", "crates/guibiao", "crates/louke", "crates/tianheng", "crates/shengmo", "crates/kanhe"]
# Every fixture and example is its own workspace root, each carrying `[workspace]`. That table is what
# keeps this workspace from absorbing their deliberate faults — `members` above is an explicit list
# with no globs, so nothing under these trees is inferred into it.
#
# **`exclude` is a second line for `examples/` only, and cargo offers none for the in-repo fixtures.**
# Measured, on a package carrying no `[workspace]` of its own:
#
#   exclude entry                          package location            result
#   `sub` (top-level directory)            not inside a member         excluded, cargo proceeds
#   `sub/a` (exact package path)           not inside a member         excluded, cargo proceeds
#   `sub/*` (glob)                         not inside a member         NOT excluded — no glob support
#   `m/tests/fixtures/a` (exact path)      inside member `m`           NOT excluded
#   `crates/tianheng/tests/fixtures`       inside member `tianheng`    NOT excluded
#
# The deciding variable is nesting: a package inside a workspace member's own directory cannot be
# excluded at all, whichever form the entry takes. Every in-repo fixture is at
# `crates/<member>/tests/fixtures/<name>`, so entries naming them were inert — they read as a defence
# that was never there, which is worse than no entry. They are dropped rather than extended.
#
# So the fixtures have exactly ONE defence, their own `[workspace]` table, and a single line needs
# holding: `crates/kanhe/tests/workspace_isolation.rs` asserts every tracked fixture and example
# manifest carries one. `examples/` is top-level, so its entry below does work, and it stays.
#
# CI exercises the examples in isolation through `crates/shengmo/tests/examples_suite.rs`.
exclude = ["examples"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tacticaldoll/tianheng"
homepage = "https://github.com/tacticaldoll/tianheng"

[workspace.dependencies]
xuanji = { path = "crates/xuanji", version = "0.6.0" }
xingbiao = { path = "crates/xingbiao", version = "0.6.0" }
hunyi = { path = "crates/hunyi", version = "0.6.0" }
guibiao = { path = "crates/guibiao", version = "0.6.0" }
louke = { path = "crates/louke", version = "0.6.0" }
serde_json = "1"
# A real TOML parser, for 勘合's manifest readers only. The hand-rolled grammar it replaces produced 69 of
# the 89 changes that touched those readers in the 0.5.0 window — dotted keys filed as two dependencies, a
# quoted tail read as no path, an escaped dot in a heading overwriting the real table. Adopted through the
# self-law amendment ritual, because 勘合's release-coherence gate calls those readers from `src/` and the
# edge is therefore Normal rather than dev-only.
toml_edit = "0.25"
# syn is the heavy AST dependency, and its perimeter is stated at the table the law observes rather than
# one word wider.
#
# **Reacted:** among `[dependencies]` — the NORMAL table — 渾儀 is the only member that may name it. Every
# sibling's `restrict_dependencies_to` allowlist in `crates/shengmo/src/law.rs` omits `syn`, so the 圭表
# core and the 璇璣 model cannot reach it and a new normal edge is an amendment, not a commit.
#
# **Not reacted, and named because it is now occupied:** `restrict_dependencies_to` observes one table, and
# `Normal` is the default every self-law boundary takes — a specified default, with its own scenario in
# `openspec/specs/crate-dependency-boundary/spec.md`. So `[dev-dependencies]` is outside every allowlist,
# and `crates/kanhe/Cargo.toml` names `syn` there: 勘合's test-only scanners parse this repository's own
# Rust rather than hand-lexing it. Nothing packages 勘合 (`publish = false`), so no adopter resolves that
# edge.
#
# This comment said `quarantined to 渾儀 (hunyi) alone` until 2026-08-21, unchanged since `0.1.0`, and
# `alone` had been false since the dev-table edge landed in the same window. A claim one word wider than
# what reacts to it is the shape a reason is forbidden from taking; the same holds where the claim sits
# beside the dependency instead of inside a `because`.
syn = { version = "2", features = ["full", "visit"] }
