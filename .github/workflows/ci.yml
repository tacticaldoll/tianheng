name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job below only checks out the repo, builds, tests, and lints it — none
# pushes a tag, comments on a PR, or writes a package. A single read-only grant covers them all,
# overriding whatever broader default the repo/org GITHUB_TOKEN scope would otherwise carry.
permissions:
  contents: read

jobs:
  release-coherence:
    name: Release coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # State classification follows the latest exact `release: X.Y.Z` commit. A shallow
          # checkout cannot observe that release spine and must not masquerade as coherent.
          fetch-depth: 0
      - name: repository release surfaces agree
        run: |
          bash scripts/test_release_coherence.sh
          bash scripts/check_release_coherence.sh
          bash scripts/test_publish_source.sh

  dod:
    name: Definition of Done
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the local Definition of Done matches what CI runs
        # AGENTS.md's Definition of Done calls itself "the single source for the local pre-flight gate
        # list ... CI runs a superset of it". That claim drifted once (both `cargo doc` invocations here
        # gained --document-private-items while the local list kept the flagless form), so the gate a
        # contributor actually runs went blind to the exact class this job had just learned to catch.
        # Checked here rather than promised in prose.
        run: |
          bash scripts/test_dod_coherence.sh
          bash scripts/check_dod_coherence.sh
      - name: whitespace hygiene across every tracked text file
        # `cargo fmt` governs .rs only, so nothing in the repository checked .md, .toml, .sh, or .yml.
        # Three blank lines at EOF reached a release branch in the 0.4.0 window, through 23 touched spec
        # files and two independent full-range adversarial reviews — one of which ran `cargo fmt --all
        # --check` and reported it passing. Neither had anything to consult, the property being stated
        # nowhere and reacted nowhere.
        run: |
          bash scripts/test_whitespace_hygiene.sh
          bash scripts/check_whitespace_hygiene.sh
      - name: in-repository references resolve
        # A reader who greps for a named file and finds nothing cannot tell stale prose from a bad
        # checkout. This class was swept by hand twice — the second time across `*.md` only — and a module
        # split landing after that sweep reintroduced it in nine places, in both documents and `.rs`
        # comments. A sweep is a snapshot; the next rename re-opens what it closed.
        run: |
          bash scripts/test_reference_integrity.sh
          bash scripts/check_reference_integrity.sh
      - name: build / test / clippy / fmt / doc
        run: |
          cargo build --workspace
          cargo clippy --all-targets -- -D warnings
          # Lint the SHIPPED lib/bins on their own (no --all-targets): an item dead in the library
          # but constructed by a test reads as live under --all-targets, so its dead_code hides
          # until the isolated crate build runs.
          cargo clippy --workspace -- -D warnings
          # Every `--workspace` / `--all-targets` pass above feature-unifies louke's `audit` ON,
          # because the tianheng shell depends on louke with features = ["audit"] unconditionally —
          # so NONE of them ever compile louke's default, prod-light (audit-OFF) library, the exact
          # config a shipped-but-unused `audit`-gated item hides in (the 0.2.0-class escape). Lint
          # louke on its own (outside the workspace, so tianheng's audit edge is absent) so such
          # dead code fails loud here, not only when `cargo publish` later builds the crate isolated.
          cargo clippy -p louke -- -D warnings
          # Doc the default (prod-light) config too: a crate-level doc must not intra-doc-link a
          # feature-gated item (it would break docs.rs, which builds default features).
          # --document-private-items because nearly every item in these crates is crate-private, and
          # without it a broken intra-doc link in that majority is invisible: 17 had accumulated,
          # every one pointing at something a module split had moved or renamed.
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --document-private-items
          # --all-features turns ON louke/audit so the gated probe-coverage scanner tests
          # actually RUN — a plain `--workspace` would cfg them out and silently skip them.
          # TIANHENG_WORKSPACE_TESTS=1 makes the workspace-dependent dogfood/dispatch tests
          # fail loud if the workspace manifest is ever absent here (never silently skip in CI).
          TIANHENG_WORKSPACE_TESTS=1 cargo test --workspace --all-features
          cargo clippy --all-targets --all-features -- -D warnings
          cargo fmt --all --check
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features --document-private-items
      - name: observation bounds are declared and defended
        # A bound claims a reaction STOPS somewhere, which is the one claim class no reaction defends. Two
        # in this repository outlived the behaviour they described for two releases, and a stale bound reads
        # as permission: it tells an auditor a real escape is governed policy.
        #
        # AFTER the build step, deliberately. Whether a citation names a test that RUNS is decided by the
        # harness's own enumeration (`cargo test -p … -- --list`), the only exact observation source for that
        # claim — three reviews defeated deciding it from source text. Run before the build it would compile
        # the workspace a second time; run after, the enumeration is warm (≈1s).
        run: |
          bash scripts/test_bound_register.sh
          bash scripts/check_bound_register.sh

  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build and test on the declared minimum supported Rust version
        run: |
          msrv="$(cargo metadata --no-deps --format-version 1 \
            | sed -n 's/.*"rust_version":"\([^"]*\)".*/\1/p' | head -n1)"
          echo "declared rust-version: ${msrv:?could not read rust-version}"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          cargo "+$msrv" build --workspace
          # --all-features so the gated CI-scanner tests run on the MSRV toolchain too;
          # TIANHENG_WORKSPACE_TESTS=1 so a missing workspace manifest fails loud, never skips.
          TIANHENG_WORKSPACE_TESTS=1 cargo "+$msrv" test --workspace --all-features

  license-files:
    name: License texts bundled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every publishable crate bundles its license texts
        run: |
          # `cargo publish` packages only files inside each crate's own directory, so the
          # workspace-root LICENSE-* files and the inherited SPDX `license` field are NOT enough:
          # each publishable crate must physically carry its license texts or it ships without
          # them (a packaging defect latent in 0.1.0/0.1.1). This is release hygiene, not
          # architectural drift, so it is a CI reaction here — not a Tianheng boundary. Catch a
          # new crate that forgets the texts before it is ever published.
          missing=0
          for manifest in crates/*/Cargo.toml; do
            dir="${manifest%/Cargo.toml}"
            if grep -qE '^[[:space:]]*publish[[:space:]]*=[[:space:]]*false' "$manifest"; then
              continue  # not published — its directory need not carry license texts
            fi
            for f in LICENSE-MIT LICENSE-APACHE; do
              if [ ! -s "$dir/$f" ]; then
                echo "::error file=$dir/$f::$dir is missing $f — cargo publish ships only crate-local files, so the crate would publish without its license text (the SPDX license field is not enough)"
                missing=1
              fi
            done
          done
          exit "$missing"

  packaged-selftest:
    name: Packaged crate self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every publishable crate's tests pass from its packaged tarball
        run: |
          # `cargo publish` ships only crate-local files, so a data file outside a crate's own
          # directory — a test fixture, the workspace root — is NOT in the tarball, and the in-repo
          # `cargo test` above never notices (those files exist in the checkout). That is a
          # package-only bug (a fixture-driven test that fails only from the published crate). This
          # gate packages each crate, extracts the tarball, and runs its tests FROM the tarball.
          # TIANHENG_WORKSPACE_TESTS is deliberately UNSET: the packaged tree legitimately has no
          # workspace root or fixtures, so the workspace-/fixture-dependent tests must SKIP (never
          # fail) — this gate proves that skip is real, not a silent hole.
          #
          # The workspace siblings are not on crates.io at the in-development version, so both the
          # packaging RESOLVE and the from-tarball test resolve them from local source via `--config
          # patch` (NOT baked into the tarball — it stays the real publishable form; the patch only
          # satisfies resolution). This is what lets the gate run at the exact pre-publish version
          # it must guard, rather than only when the deps happen to already be published.
          set -euo pipefail
          ws="$PWD"
          patch=()
          for s in xuanji xingbiao guibiao hunyi louke; do
            patch+=(--config "patch.crates-io.$s.path=\"$ws/crates/$s\"")
          done
          for crate in xuanji xingbiao guibiao hunyi louke tianheng; do
            cargo package --no-verify -p "$crate" "${patch[@]}"
            tarball="$(ls target/package/${crate}-*.crate | head -1)"
            work="$(mktemp -d)"
            tar xzf "$tarball" -C "$work"
            dir="$(ls -d "$work"/${crate}-*/)"
            echo "::group::packaged self-test: $crate"
            ( cd "$dir" && cargo test --all-features "${patch[@]}" )
            echo "::endgroup::"
          done

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: license / advisory / bans / sources policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  reaction:
    name: Tianheng reaction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: reaction passes on a clean target
        run: cargo run -p tianheng -- check --manifest-path crates/tianheng/tests/fixtures/clean/Cargo.toml
      - name: reaction fails with exit 1 on a violating target (1, not 2 — the contract separates them)
        run: |
          status=0
          cargo run -p tianheng -- check --manifest-path crates/tianheng/tests/fixtures/violating/Cargo.toml || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::violating fixture must react with exit 1 (enforced violation), got $status"
            exit 1
          fi
      - name: the SARIF projection is valid and still reacts with exit 1
        run: |
          status=0
          out=$(cargo run -q -p tianheng -- check --manifest-path crates/tianheng/tests/fixtures/violating/Cargo.toml --format sarif) || status=$?
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q '"version": "2.1.0"' \
            || { echo "::error::--format sarif did not emit a SARIF 2.1.0 document"; exit 1; }
          if [ "$status" -ne 1 ]; then
            echo "::error::--format sarif must still react with exit 1 on a violation, got $status"
            exit 1
          fi

  examples:
    name: Examples dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every example reacts as declared
        # Each example under examples/ is its own workspace carrying a deliberate fault and the
        # adopter's real `= "0.3"` dependency form; the script patches the family to local source
        # (the packaged-selftest idiom) and asserts each reaction — the dogfood does not rot.
        run: |
          bash scripts/test_published_family_coverage.sh
          bash scripts/test_example_quality_gate.sh
          bash scripts/test_example_suite.sh
          bash scripts/test_examples.sh
