name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job below only checks out the repo, builds, tests, and lints it — none
# pushes a tag, comments on a PR, or writes a package. A single read-only grant covers them all,
# overriding whatever broader default the repo/org GITHUB_TOKEN scope would otherwise carry.
permissions:
  contents: read

# Every `uses:` below names a COMMIT, with the release it was that tag's tip at in a trailing comment.
#
# This is the argument the `npm ci` step further down already makes, applied to the one ecosystem it was
# not applied to. A tag is repointable by whoever owns the action, so `@v5` resolves the executed code
# fresh on every run with no lock and no integrity check — verbatim what `npx` was doing before the
# committed `package-lock.json` replaced it. Cargo is pinned by `Cargo.lock`, npm by
# `package-lock.json`, and until now the runner's own executable dependencies were pinned by nothing.
#
# `permissions: contents: read` above bounds what a substituted action could reach, and bounding is not
# closing: the grant limits the blast radius of code this repository never chose to run, rather than
# stopping it from running.
#
# **Refreshing them is a human act with no automation behind it, deliberately** — see `BACKLOG.md`'s
# accepted-debt entry. To move one, resolve the tag and paste the commit:
#
#   gh api repos/actions/checkout/commits/v5 --jq .sha
#
# The `commits` endpoint, not `git/ref/tags`. Measured against both actions pinned below: a lightweight tag's
# ref answers `object.type=commit`, an ANNOTATED tag's answers `object.type=tag`, and its `.object.sha` is the
# tag object rather than the commit — `cargo-deny-action@v2` is annotated, so the ref form yields a SHA that is
# not a commit and cannot be pinned. `commits/<tag>` dereferences either kind, and its answers are byte-equal
# to what each `uses:` in this file pins.
#
# Pinning is not upgrading: each SHA below is what that major tag pointed at when it was pinned, so this
# changed which bytes run and not which version.

jobs:
  release-coherence:
    name: Release coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # State classification follows the latest exact `release: X.Y.Z` commit. A shallow
          # checkout cannot observe that release spine and must not masquerade as coherent.
          fetch-depth: 0
      - name: repository release surfaces agree
        run: |
          TIANHENG_WORKSPACE_TESTS=1 cargo test -p kanhe --test release_coherence --test publish_source

  dod:
    name: Definition of Done
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The workspace suite now carries the release-coherence check, whose state classification
          # follows the latest exact `release: X.Y.Z` commit. A shallow checkout cannot see that spine and
          # the check refuses rather than masquerading as coherent — which is the contract working, and
          # the reason this job needs the whole history.
          fetch-depth: 0
      - name: the local Definition of Done matches what CI runs
        run: |
          TIANHENG_WORKSPACE_TESTS=1 cargo test -p kanhe --test dod_coherence
      - name: whitespace hygiene across every tracked text file
        run: |
          TIANHENG_WORKSPACE_TESTS=1 cargo test -p kanhe --test whitespace_hygiene
      - name: in-repository references resolve
        run: |
          TIANHENG_WORKSPACE_TESTS=1 cargo test -p kanhe --test reference_integrity
      - name: every declared mutation kills the pin it names
        run: |
          TIANHENG_PIN_BITES=1 TIANHENG_WORKSPACE_TESTS=1 cargo test -p kanhe --test pin_bites
      - name: build / test / clippy / fmt / doc
        run: |
          cargo build --workspace
          cargo clippy --all-targets -- -D warnings
          cargo clippy --workspace -- -D warnings
          cargo clippy -p louke -- -D warnings
          cargo test -p louke
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --document-private-items
          TIANHENG_WORKSPACE_TESTS=1 cargo test --workspace --all-features
          cargo clippy --all-targets --all-features -- -D warnings
          cargo fmt --all --check
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features --document-private-items
      - name: the interpreter that runs the pinned validator is pinned too
        # **The argument the pinning above makes, applied to the one thing it left out.** A repointable
        # dependency resolves fresh executable code on every run, so every `uses:` names a commit and the npm
        # tree is reproduced from a committed lock with `--ignore-scripts`. The **Node** that executes that
        # tree was whatever the runner image happened to carry: GitHub changes the image's Node major and the
        # bytes running the validator change, with nothing in this file, the specs or `BACKLOG.md` covering
        # it. A claim one word wider than what reacts to it is the shape this repository removes on sight.
        #
        # **The lock sets a floor and does not choose this major.** `@fission-ai/openspec` declares
        # `>=20.19.0` and `posthog-node` `^20.20.0 || >=22.22.0` — Node 22 satisfies both, so an earlier
        # comment here claiming the major was what the lock required was reading a floor as a selection. 24 is
        # chosen by a lifecycle argument the lock cannot make: Node 20 left support before this was written
        # and 22 follows it. The choice is stated rather than attributed.
        #
        # **Exact, because a major is a repointable dependency and that is what this step exists to close.**
        # `'24'` resolves whatever 24.x the runner's mirror carries that day, so the bytes running the
        # validator still changed with nothing in this file covering it — the same argument one field
        # narrower. The cost is a hand-maintained pin nobody refreshes, which is the debt the action SHAs
        # above already carry and is filed with them rather than pretended away.
        #
        # `package.json`'s `engines.node` bounds the same major at both ends and `.npmrc` makes npm **stop**
        # on it rather than warn, so a local Definition of Done that cannot match CI says so instead of
        # differing silently. Measured on npm 11.13.0: without `engine-strict`, an unsatisfiable `engines`
        # exits 0; with it, `npm ci` exits 1 naming the requirement and what is actually installed.
        #
        # **The pin carries its own expiry, because the debt it created had no mechanism and its own
        # promotion trigger had already fired.** `BACKLOG.md` filed this beside the action SHAs under
        # *a hand-maintained pin has no mechanism keeping it from rotting*, whose trigger reads *a second
        # ecosystem arriving whose pinning would want the same answer* — and this pin is that second
        # ecosystem, added to the entry that says so. The half with teeth is not falling behind within a
        # major, which `engines` plus `engine-strict` already bound; it is running an interpreter past the
        # point anyone ships fixes for it, silently, because nobody looked.
        #
        # The `NOT-BEYOND` declaration is a **commitment of this repository**, not an assertion about Node:
        # this tree does not run major 24 beyond the date it names. `interpreter_support_window` holds it,
        # refuses when the major beside it stops matching the pin, and refuses once the date is reached — so
        # the reminder is a reaction rather than someone's memory. The date is chosen from the Node release schedule
        # (`nodejs.org/en/about/previous-releases`: 24 entered LTS as 24.11.0 and is maintained to the end
        # of April 2028); that choice is the one thing here nothing offline can hold, and it is a commitment
        # precisely so the unheld part is a decision this repository owns rather than a fact it claims.
        # NOT-BEYOND: 24 2028-04-30
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'

      - name: every spec validates
        # `npm ci` rather than `npx --yes @fission-ai/openspec@1.4.1`. The exact-version pin was real — npm
        # forbids republishing a version — but it bound only the direct package, while `npx` resolved the
        # TRANSITIVE tree fresh on every run with no lock and no integrity check. So a newly published
        # transitive release executed here, on a checkout of the release branch, and in every contributor's
        # local Definition of Done. The committed lock pins all 80 resolved packages by integrity digest, and
        # `--no-install` refuses to reach the network if the tree is not the one the lock names.
        #
        # `--ignore-scripts` closes the half the lock does not. A lock pins *which* packages install; it
        # does not stop the 80 of them running `preinstall`/`install`/`postinstall` on a checkout of the
        # release branch. The validator is a JS CLI with no build step, so nothing here needs them.
        run: |
          npm ci --ignore-scripts
          npx --no-install openspec validate --specs --strict
      - name: observation bounds are declared and defended
        run: |
          TIANHENG_WORKSPACE_TESTS=1 cargo test -p kanhe --test bound_register

  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: build and test on the declared minimum supported Rust version
        run: |
          msrv="$(cargo metadata --no-deps --format-version 1 \
            | sed -n 's/.*"rust_version":"\([^"]*\)".*/\1/p' | head -n1)"
          echo "declared rust-version: ${msrv:?could not read rust-version}"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          cargo "+$msrv" build --workspace
          # --all-features so the gated CI-scanner tests run on the MSRV toolchain too;
          # TIANHENG_WORKSPACE_TESTS=1 so a missing workspace manifest fails loud, never skips.
          TIANHENG_WORKSPACE_TESTS=1 cargo "+$msrv" test --workspace --all-features

  license-files:
    name: License texts bundled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: every publishable crate bundles its license texts
        run: |
          # `cargo publish` packages only files inside each crate's own directory, so the
          # workspace-root LICENSE-* files and the inherited SPDX `license` field are NOT enough:
          # each publishable crate must physically carry its license texts or it ships without
          # them (a packaging defect latent in 0.1.0/0.1.1). This is release hygiene, not
          # architectural drift, so it is a CI check here — not a Tianheng boundary. Catch a
          # new crate that forgets the texts before it is ever published.
          missing=0
          for manifest in crates/*/Cargo.toml; do
            dir="${manifest%/Cargo.toml}"
            if grep -qE '^[[:space:]]*publish[[:space:]]*=[[:space:]]*false' "$manifest"; then
              continue  # not published — its directory need not carry license texts
            fi
            for f in LICENSE-MIT LICENSE-APACHE; do
              if [ ! -s "$dir/$f" ]; then
                echo "::error file=$dir/$f::$dir is missing $f — cargo publish ships only crate-local files, so the crate would publish without its license text (the SPDX license field is not enough)"
                missing=1
              fi
            done
          done
          exit "$missing"

  packaged-selftest:
    name: Packaged crate self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: every publishable crate's tests pass from its packaged tarball
        run: |
          # `cargo publish` ships only crate-local files, so a data file outside a crate's own
          # directory — a test fixture, the workspace root — is NOT in the tarball, and the in-repo
          # `cargo test` above never notices (those files exist in the checkout). That is a
          # package-only bug (a fixture-driven test that fails only from the published crate). This
          # gate packages each crate, extracts the tarball, and runs its tests FROM the tarball.
          # TIANHENG_WORKSPACE_TESTS is deliberately UNSET: the packaged tree legitimately has no
          # workspace root or fixtures, so the workspace-/fixture-dependent tests must SKIP (never
          # fail) — this gate proves that skip is real, not a silent hole.
          #
          # The workspace siblings are not on crates.io at the in-development version, so both the
          # packaging RESOLVE and the from-tarball test resolve them from local source via `--config
          # patch` (NOT baked into the tarball — it stays the real publishable form; the patch only
          # satisfies resolution). This is what lets the gate run at the exact pre-publish version
          # it must guard, rather than only when the deps happen to already be published.
          set -euo pipefail
          ws="$PWD"
          # **The set is derived, and it used to be written twice.** This job's name claims *every
          # publishable crate*, and the claim was two hand-written lists that nothing held. The
          # `license-files` job above derives the same set from the same two facts, and
          # `release_coherence_gate` derives it from `cargo metadata` for the recorded reason that a
          # path-shaped corpus went stale — so a seventh publishable crate would have been caught there and
          # silently skipped here, while this name went on saying every. One enumerator, one claim.
          crates=()
          for manifest in crates/*/Cargo.toml; do
            grep -qE '^[[:space:]]*publish[[:space:]]*=[[:space:]]*false' "$manifest" && continue
            crates+=("$(basename "$(dirname "$manifest")")")
          done
          # **A derived set can be empty and a hand-written one cannot, so the reach is asserted.** With
          # `crates=()` empty, `for crate in "${crates[@]}"` expands to nothing, the loop body never runs and
          # this job reports success over zero crates — the exact shape `gate-shape-contract` was retired for
          # reaching, "enumerating zero gates and reporting clean over all of it". The hand lists this
          # replaces could not do that. So the enumerator states its own floor.
          if ((${#crates[@]} == 0)); then
            echo "::error::no publishable crate was derived from crates/*/Cargo.toml — this job packages and \
          tests every one of them, and it will not report success over none"
            exit 1
          fi
          echo "derived ${#crates[@]} publishable crates: ${crates[*]}"
          # Every derived member is patched, including one this packaging does not reach. An unused patch is
          # a warning and exit 0 — measured on cargo 1.96.0 packaging `xuanji` with all six patched — and
          # the alternative is a second hand-written fact, "which of them is the shell nobody depends on",
          # replacing the one just removed.
          patch=()
          for s in "${crates[@]}"; do
            patch+=(--config "patch.crates-io.$s.path=\"$ws/crates/$s\"")
          done
          for crate in "${crates[@]}"; do
            cargo package --no-verify -p "$crate" "${patch[@]}"
            tarball="$(ls target/package/${crate}-*.crate | head -1)"
            work="$(mktemp -d)"
            tar xzf "$tarball" -C "$work"
            dir="$(ls -d "$work"/${crate}-*/)"
            echo "::group::packaged self-test: $crate"
            ( cd "$dir" && cargo test --all-features "${patch[@]}" )
            echo "::endgroup::"
          done

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: license / advisory / bans / sources policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  reaction:
    name: Tianheng reaction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: reaction passes on a clean target
        run: cargo run -p tianheng -- check --manifest-path crates/tianheng/tests/fixtures/clean/Cargo.toml
      - name: reaction fails with exit 1 on a violating target (1, not 2 — the contract separates them)
        run: |
          status=0
          cargo run -p tianheng -- check --manifest-path crates/tianheng/tests/fixtures/violating/Cargo.toml || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::violating fixture must react with exit 1 (enforced violation), got $status"
            exit 1
          fi
      - name: the SARIF projection is valid and still reacts with exit 1
        run: |
          status=0
          out=$(cargo run -q -p tianheng -- check --manifest-path crates/tianheng/tests/fixtures/violating/Cargo.toml --format sarif) || status=$?
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q '"version": "2.1.0"' \
            || { echo "::error::--format sarif did not emit a SARIF 2.1.0 document"; exit 1; }
          if [ "$status" -ne 1 ]; then
            echo "::error::--format sarif must still react with exit 1 on a violation, got $status"
            exit 1
          fi

  examples:
    name: Examples dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: every example reacts as declared
        run: |
          TIANHENG_EXAMPLES=1 TIANHENG_WORKSPACE_TESTS=1 cargo test -p shengmo --test examples_suite
