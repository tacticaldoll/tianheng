# Standalone adoption of 圭表 (guibiao) — the syn-free static import/dependency linter.
#
# This example is its own workspace (`[workspace]` below) so its *deliberate* boundary
# violation (domain → infra) is never swept by Tianheng's workspace-wide gates. CI runs it in
# isolation through `crates/shengmo/tests/examples_suite.rs`, which patches the family crates to local source so
# the manifest keeps the adopter's real published-version requirement while exercising this
# checkout. The footprint is deliberately one dependency, no `syn`: that light
# footprint IS the 圭表 product pitch, demonstrated here rather than asserted.
[package]
name = "hexagonal_demo"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
guibiao = "0.4"

[workspace]
